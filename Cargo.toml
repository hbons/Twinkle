[package]
name = "SparkleShare"
version = "51.0.0"
description = "Sync files with Git"
homepage = "https://sparkleshare.org"
repository = "https://www.github.com/hbons/SparkleShare"
authors = ["Hylke Bons <hello@planetpeanut.studio>"]
license = "GPL-3.0-or-later"
readme = "README.md"
edition = "2024"
keywords = ["dropbox", "git", "gtk", "network", "sync"]
categories = ["command-line-utilities", "development-tools",
    "filesystem", "game-development", "network-programming"]

[package.metadata.flatpak]
id = "studio.planetpeanut.SparkleShare"


[dependencies]
# From the Recommended Crate Directory – https://blessed.rs/
chrono = "0.4.42"
futures-util = "0.3.32"
notify = "8.2.0"
sha2 = "0.11.0"
tokio = { version = "1.52.3", features = ["full"] }
tokio-tungstenite = { version = "0.30.0", features = ["native-tls"] }

# From the GNOME Project – https://gnome.org/
gio = "0.22.9"
gtk4 = { version = "0.11.4", features = ["gnome_50"], optional = true }
libadwaita = { version = "0.9.2", features = ["v1_9"], optional = true }
# libsecret = { version = "0.8.0", optional = true }

[features]
default = []
gnome = [
    "dep:gtk4",
    "dep:libadwaita",
    # "dep:libsecret",
]


[[bin]]
name = "sparkleshare"
path = "src/main.rs"

[profile.release]
opt-level = "z"
lto = true
debug = false
codegen-units = 1
panic = "abort"
strip = true
