[package]
name = "Twinkle"
version = "50.0.0"
description = "Sync files with Git"
homepage = "https://planetpeanut.studio/twinkle"
repository = "https://www.github.com/hbons/Twinkle"
authors = ["Hylke Bons <hello@planetpeanut.studio>"]
license = "GPL-3.0-or-later"
readme = "README.md"
edition = "2024"
keywords = ["dropbox", "git", "gtk", "network", "sync"]
categories = ["command-line-utilities", "development-tools",
    "filesystem", "game-development", "network-programming"]

[dependencies]
# From the Recommended Crate Directory – https://blessed.rs/
chrono = "0.4.42"
futures-util = "0.3.32"
notify = "8.2.0"
sha2 = "0.11.0"
tokio = { version = "1.52.3", features = ["full"] }
tokio-tungstenite = { version = "0.30.0", features = ["native-tls"] }

# From the GNOME Project – https://gnome.org/
# gtk4 = { version = "0.10.1", optional = true }
# libadwaita = { version = "0.8.0", optional = true }
# libsecret = { version = "0.8.0", optional = true }

[features]
default = []
gnome = [
    # "dep:gtk4",
    # "dep:libadwaita",
    # "dep:libsecret",
]

[[bin]]
name = "twinkle"
path = "src/main.rs"

[profile.release]
opt-level = "z"
lto = true
debug = false
codegen-units = 1
panic = "abort"
strip = true
