name: Integration

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

env:
  GH_TOKEN: ${{ secrets.GH_TOKEN }}
  CARGO_TERM_COLOR: always

jobs:
  integration:
    strategy:
      matrix:
        variant:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: macos-26

    runs-on: ${{ matrix.variant.runner }}
    timeout-minutes: 8

    steps:
    - uses: actions/checkout@v7

    - name: Install
      run: cargo install --path .

    - name: Versions
      run: |
        gh --version
        gh auth status
        twinkle --deps

    - run: rm -Rf .git/

    # - name: Test `clone`
