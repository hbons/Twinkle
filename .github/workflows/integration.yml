name: Integration

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  integration:
    strategy:
      matrix:
        variant:
          - arch: x86_64
            runner: ubuntu-24.04
          # - arch: aarch64
          #   runner: ubuntu-24.04-arm  # TODO: macOS
      max-parallel: 1
    runs-on: ${{ matrix.variant.runner }}
    timeout-minutes: 8

    steps:
    - uses: actions/checkout@v7

    - name: Install
      run: cargo install --path .

    - name: Versions
      run: |
        twinkle --deps
        twinkle --version

    - name: Set up mock Git host
      run: cd tests && sudo ./common/git-host.sh

    - name: Create Git repositories
      run: cd tests && sudo ./common/git-repos.sh

    - name: Generate and install SSH keys
      run: cd tests && ./common/install_keys.sh

    - run: rm -Rf .git/


    # Core

    - name: Test `clone`
      run: cd tests && ./test_clone.sh

    - name: Test `clone_empty`
      run: cd tests && ./test_clone_empty.sh

    - name: Test `init`
      run: cd tests &&./test_init.sh

    - name: Test `init_empty`
      run: cd tests &&./test_init_empty.sh

    - name: Test `sync`
      run: cd tests && ./test_sync.sh

    - name: Test `sync_empty`
      run: cd tests && ./test_sync_empty.sh


    # Conflicts

    - name: Test `conflict_sync_aa`
      run: cd tests/conflict && ./test_sync_aa.sh

    - name: Test `conflict_sync_au`
      run: cd tests/conflict && ./test_sync_au.sh

    - name: Test `conflict_sync_dd`
      run: cd tests/conflict && ./test_sync_dd.sh

    - name: Test `conflict_sync_du`
      run: cd tests/conflict && ./test_sync_du.sh

    - name: Test `conflict_sync_ua`
      run: cd tests/conflict && ./test_sync_ua.sh

    - name: Test `conflict_sync_ud`
      run: cd tests/conflict && ./test_sync_ud.sh

    - name: Test `conflict_sync_uu`
      run: cd tests/conflict && ./test_sync_uu.sh


    # LFS

#     - name: Test `lfs_clone`  # TODO: CI needs a git-lfs service
#       run: cd tests/lfs && ./test_lfs_clone.sh

#     - name: Test `lfs_sync`
#       run: cd tests/lfs && ./test_lfs_sync.sh
