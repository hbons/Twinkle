name: Integration

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

env:
  GH_TOKEN: ${{ secrets.GH_TOKEN }}
  CARGO_TERM_COLOR: always

jobs:
  integration-tests:
    strategy:
      matrix:
        variant:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: macos-26

    runs-on: ${{ matrix.variant.runner }}

    steps:
    - uses: actions/checkout@v7

    - name: Install Dependencies
      if: runner.os == 'macOS'
      run: brew install coreutils  # Needed for `timeout`

    - name: Install
      run: cargo install --path .

    - name: Info
      run: |
        gh --version
        gh auth status
        twinkle --deps

    - run: rm -Rf .git/

    - name: Test `init`
      run: |
        cd tests
        ./test_init.sh

    - name: Test `clone`
      run: |
        cd tests
        ./test_clone.sh

    - name: Test `clone_empty`
      run: |
        cd tests
        ./test_clone_empty.sh

    - name: Test `sync`
      run: |
        cd tests
        ./test_sync.sh
