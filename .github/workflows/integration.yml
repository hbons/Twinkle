name: Integration

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

env:
  GH_TOKEN: ${{ secrets.GH_TOKEN }}
  CARGO_TERM_COLOR: always

jobs:
  integration:
    strategy:
      matrix:
        variant:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: macos-26

    runs-on: ${{ matrix.variant.runner }}
    timeout-minutes: 8

    steps:
    - uses: actions/checkout@v7

    - name: Install
      run: cargo install --path .

    - name: Versions
      run: |
        gh --version
        gh auth status
        twinkle --deps

    - run: rm -Rf .git/

    - name: Test `init`
      run: cd tests &&./test_init.sh

    - name: Test `init_empty`
      run: cd tests &&./test_init_empty.sh

    - name: Test `clone`
      run: cd tests && ./test_clone.sh

    - name: Test `clone_empty`
      run: cd tests && ./test_clone_empty.sh

    - name: Test `sync`
      run: cd tests && ./test_sync.sh

    - name: Test `lfs_clone`
      run: cd tests/lfs && ./test_lfs_clone.sh

    - name: Test `lfs_sync`
      run: cd tests/lfs && ./test_lfs_sync.sh
