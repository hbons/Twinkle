name: Flatpak

on:
  push:
    branches:
      - main
      - dev

permissions:
  contents: write

jobs:
  flatpak:
    name: "Flatpak (${{ matrix.variant.arch }})"
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    strategy:
      matrix:
        variant:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.variant.runner }}
    steps:
    - uses: actions/checkout@v7
    - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
      with:
        bundle: twinkle.flatpak
        manifest-path: studio.planetpeanut.Twinkle.yml
        cache-key: flatpak-builder-${{ github.sha }}
        arch: ${{ matrix.variant.arch }}

    - name: Rename bundle per arch
      run: mv twinkle.flatpak twinkle-${{ matrix.variant.arch }}-${{ github.sha }}.flatpak

    - name: Upload to `Nightly Flatpak` release
      uses: softprops/action-gh-release@v3
      with:
        tag_name: flatpak-nightly
        name: "Flatpak: Nightly"
        files: twinkle-${{ matrix.variant.arch }}.flatpak
        prerelease: true
        make_latest: false
