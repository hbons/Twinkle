name: Flatpak

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  flatpak:
    name: "Flatpak (${{ matrix.variant.arch }})"
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
    strategy:
      matrix:
        variant:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.variant.runner }}
    steps:
    - uses: actions/checkout@v7
    - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
      with:
        bundle: studio.planetpeanut.SparkleShare.flatpak
        manifest-path: studio.planetpeanut.SparkleShare.yml
        cache-key: flatpak-builder-${{ github.sha }}
        arch: ${{ matrix.variant.arch }}

    - name: Tag
      run: |
        git config --global --add safe.directory "$GITHUB_WORKSPACE"
        git tag -f flatpak-nightly
        git push origin flatpak-nightly --force
