app-id: studio.planetpeanut.Twinkle
branch: stable
command: twinkle
runtime: org.gnome.Platform
runtime-version: '50'

sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    RUST_BACKTRACE: '1'

finish-args:
  - --filesystem=host
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11

modules:
  - name: openssh
    sources:
      - type: archive
        url: https://ftp.jaist.ac.jp/pub/OpenBSD/OpenSSH/portable/openssh-10.6p2.tar.gz
        sha256: 9ae44872090cf2f06b3cf9ff147e7f16f309671340763ed2f99248398ae29d5b
    build-options:
      strip: true
    config-opts:
      - --without-gss-api
      - --without-kerberos
      - --without-kerberos5
      - --without-lastlog
      - --without-ldap
      - --without-pie
      - --without-smartcard
      - --without-wtmp
      - --without-zlib
    cleanup:
      - /bin/scp
      - /bin/sftp
      - /bin/ssh-add
      - /bin/ssh-agent
      - /bin/ssh-keysign
      - /bin/ssh-argv0
      - /libexec/sftp-server
      - /libexec/sshd
      - /sbin/sshd
      - /share/doc
      - /share/man

  - name: git
    sources:
      - type: archive
        url: https://www.kernel.org/pub/software/scm/git/git-2.56.1.tar.xz
        sha256: f0b0bf89264b9bd2e1c640363e7529643989da76281600473c50745cd34a607f
    buildsystem: simple
    build-commands:
      - make configure
      - CFLAGS='-Os -pipe' ./configure --prefix=/app
      - make NO_TCLTK=1 NO_GETTEXT=1 NO_CURL=1 NO_EXPAT=1 NO_OPENSSL=1 NO_ICONV=1 NO_PCRE=1 NO_PERL=1 NO_PYTHON=1 NO_INSTALL_HARDLINKS=1
      - make strip install
    cleanup:
      - /bin/git-cvsserver
      - /lib/*.la
      - /lib/pkgconfig
      - /libexec/git-core/git-am
      - /libexec/git-core/git-credential-store
      - /libexec/git-core/git-credential-cache
      - /libexec/git-core/git-daemon
      - /libexec/git-core/git-format-patch
      - /libexec/git-core/git-http-backend
      - /libexec/git-core/git-instaweb
      - /libexec/git-core/git-p4
      - /libexec/git-core/git-quiltimport
      - /libexec/git-core/git-send-email
      - /libexec/git-core/git-shell
      - /libexec/git-core/git-receive-pack
      - /libexec/git-core/git-svn*
      - /libexec/git-core/git-upload-archive
      - /libexec/git-core/git-upload-pack
      - /libexec/git-core/git-web*
      - /share/doc
      - /share/locale
      - /share/git-core/contrib
      - /share/git-core/templates
      - /share/git-core/Documentation
      - /share/man

  - name: git-lfs
    sources:  # TODO: Use git-lfs-vendor-v3.8.1.tar.gz to build from source
      - type: archive
        only-arches: [x86_64]
        url: https://github.com/git-lfs/git-lfs/releases/download/v3.8.1/git-lfs-linux-amd64-v3.8.1.tar.gz
        sha256: e72cf723a4a660438862282e8aecf3885fc8123e88bfcad534cf6b941a354b75
      - type: archive
        only-arches: [aarch64]
        url: https://github.com/git-lfs/git-lfs/releases/download/v3.8.1/git-lfs-linux-arm64-v3.8.1.tar.gz
        sha256: 67895dd77b63329796bc5efdd47b57f218e1f7b98717ebaf936a8238dbcaec0f
    buildsystem: simple
    build-commands:
      - cp git-lfs /app/libexec/git-core/

  - name: twinkle
    buildsystem: meson
    builddir: true
    build-options:
      build-args:
        - --share=network
    sources:
      - type: dir
        path: "."
