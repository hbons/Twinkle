app-id: studio.planetpeanut.Twinkle
branch: stable
command: twinkle
runtime: org.gnome.Platform
runtime-version: '50'

sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    RUST_BACKTRACE: '1'

finish-args:
  - --filesystem=host
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11

modules:
  - name: openssh
    sources:
      - type: archive
        url: https://ftp.jaist.ac.jp/pub/OpenBSD/OpenSSH/portable/openssh-10.4p1.tar.gz
        sha256: ef6026dd2aea8d56059638d5d3262902c892ceba9f88395835e0d06d3fb63238
    build-options:
      strip: true
    config-opts:
      - --without-gss-api
      - --without-kerberos
      - --without-kerberos5
      - --without-lastlog
      - --without-ldap
      - --without-pie
      - --without-smartcard
      - --without-wtmp
      - --without-zlib
    cleanup:
      - /bin/scp
      - /bin/sftp
      - /bin/ssh-add
      - /bin/ssh-agent
      - /bin/ssh-keysign
      - /bin/ssh-argv0
      - /libexec/sftp-server
      - /libexec/sshd
      - /sbin/sshd
      - /share/doc
      - /share/man

  - name: git
    sources:
      - type: archive
        url: https://www.kernel.org/pub/software/scm/git/git-2.55.0.tar.xz
        sha256: 457fdb04dc8728e007d4688695e6912e6f680727920f2a40bf11eacc17505357
    buildsystem: simple
    build-commands:
      - make configure
      - CFLAGS='-Os -pipe' ./configure --prefix=/app
      - make NO_TCLTK=1 NO_GETTEXT=1 NO_CURL=1 NO_EXPAT=1 NO_OPENSSL=1 NO_ICONV=1 NO_PCRE=1 NO_PERL=1 NO_PYTHON=1 NO_INSTALL_HARDLINKS=1
      - make strip install
    cleanup:
      - /bin/git-cvsserver
      - /lib/*.la
      - /lib/pkgconfig
      - /libexec/git-core/git-am
      - /libexec/git-core/git-credential-store
      - /libexec/git-core/git-credential-cache
      - /libexec/git-core/git-daemon
      - /libexec/git-core/git-format-patch
      - /libexec/git-core/git-http-backend
      - /libexec/git-core/git-instaweb
      - /libexec/git-core/git-p4
      - /libexec/git-core/git-quiltimport
      - /libexec/git-core/git-send-email
      - /libexec/git-core/git-shell
      - /libexec/git-core/git-receive-pack
      - /libexec/git-core/git-svn*
      - /libexec/git-core/git-upload-archive
      - /libexec/git-core/git-upload-pack
      - /libexec/git-core/git-web*
      - /share/doc
      - /share/locale
      - /share/git-core/contrib
      - /share/git-core/templates
      - /share/git-core/Documentation
      - /share/man

  - name: git-lfs
    sources:
      - type: archive
        only-arches: [x86_64]
        url: https://github.com/git-lfs/git-lfs/releases/download/v3.7.1/git-lfs-linux-amd64-v3.7.1.tar.gz
        sha256: 1c0b6ee5200ca708c5cebebb18fdeb0e1c98f1af5c1a9cba205a4c0ab5a5ec08
      - type: archive
        only-arches: [aarch64]
        url: https://github.com/git-lfs/git-lfs/releases/download/v3.7.1/git-lfs-linux-arm64-v3.7.1.tar.gz
        sha256: 73a9c90eeb4312133a63c3eaee0c38c019ea7bfa0953d174809d25b18588dd8d
    buildsystem: simple
    build-commands:
      - cp git-lfs /app/libexec/git-core/

  - name: twinkle
    buildsystem: meson
    builddir: true
    build-options:
      build-args:
        - --share=network
    sources:
      - type: dir
        path: "."
